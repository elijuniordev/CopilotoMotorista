name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 35, 36]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify repository wrapper
        run: test -f ./gradlew && chmod +x ./gradlew
      - name: Run unit tests and build APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - name: Publish validation APKs
        if: matrix.api-level == 35
        uses: actions/upload-artifact@v6
        with:
          name: copiloto-motorista-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Room instrumentation tests (API ${{ matrix.api-level }})
    needs: build-and-test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api-level: [26, 35]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify repository wrapper
        run: test -f ./gradlew && chmod +x ./gradlew
      - name: Run database persistence tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: adb shell getprop ro.build.version.sdk && adb shell getprop sys.boot_completed && ./gradlew --no-daemon connectedDebugAndroidTest
