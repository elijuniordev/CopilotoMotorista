name: Android CI

on:
  push:
    branches: [master, feat/copiloto-pro-brand-identity, fix/overlay-stability-20261121]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 35, 36]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify repository wrapper
        run: test -f ./gradlew && chmod +x ./gradlew
      - name: Prepare private release signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/copiloto-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Run unit tests and build APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease bundleRelease
      - name: Audit release dependencies and application network APIs
        if: matrix.api-level == 35
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath --console=plain > "$RUNNER_TEMP/release-dependencies.txt"
          python3 - "$RUNNER_TEMP/release-dependencies.txt" app/src/main/java <<'PY'
          import pathlib
          import re
          import sys

          dependency_report = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          source_root = pathlib.Path(sys.argv[2])
          forbidden_dependencies = re.compile(
              r"(?i)(?:okhttp|retrofit|ktor-client|"
              r"com\.google\.firebase:(?!firebase-(?:components|encoders(?:-json)?|annotations)(?::|$))|"
              r"firebase-(?:analytics|crashlytics|performance|messaging|remote-config|"
              r"installations|auth|database|storage|firestore|functions|inappmessaging|appcheck)|"
              r"sentry|amplitude|mixpanel|bugsnag|appcenter|volley|cronet|"
              r"play-services-ads)"
          )
          dependency_hits = sorted({
              line.strip()
              for line in dependency_report.splitlines()
              if forbidden_dependencies.search(line)
          })
          network_api = re.compile(
              r"(?i)(?:java\.net\.(?:URL|URLConnection|HttpURLConnection|"
              r"HttpsURLConnection|Socket|DatagramSocket)|"
              r"okhttp3\.|retrofit2\.|io\.ktor\.client|"
              r"android\.webkit\.WebView|"
              r"Firebase(?:Analytics|Crashlytics)?|"
              r"io\.sentry|com\.amplitude|com\.mixpanel)"
          )
          source_hits = []
          for path in source_root.rglob("*.kt"):
              for number, line in enumerate(path.read_text(errors="replace").splitlines(), 1):
                  if network_api.search(line):
                      source_hits.append(f"{path}:{number}: {line.strip()}")
          if dependency_hits or source_hits:
              if dependency_hits:
                  print("Review network-capable/transmission dependency candidates:")
                  print("\n".join(dependency_hits))
              if source_hits:
                  print("Review application network API references:")
                  print("\n".join(source_hits))
              raise SystemExit("Release network-surface audit requires manual review.")
          print("Release dependency and application-source network-surface checks passed.")
          print("This static check does not prove absence of runtime network traffic.")
          PY
      - name: Verify Release APK manifest privacy settings
        if: matrix.api-level == 35
        shell: bash
        run: |
          set -euo pipefail
          MERGED_MANIFEST="$(find app/build/intermediates/merged_manifest/release -type f -name AndroidManifest.xml -print -quit)"
          test -n "$MERGED_MANIFEST"
          python3 - "$MERGED_MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          manifest_path = sys.argv[1]
          root = ET.parse(manifest_path).getroot()
          android_ns = "{http://schemas.android.com/apk/res/android}"
          permissions = {
              node.get(android_ns + "name")
              for node in root.findall("uses-permission")
          }
          assert "android.permission.INTERNET" not in permissions, (
              "Release merged manifest declares INTERNET permission"
          )
          app = root.find("application")
          assert app is not None, "Release merged manifest has no application element"
          assert app.get(android_ns + "allowBackup") == "false", (
              "Release merged manifest must keep allowBackup=false"
          )
          assert app.get(android_ns + "dataExtractionRules") == "@xml/data_extraction_rules", (
              "Release merged manifest is missing the explicit data extraction rules"
          )
          print("Release manifest privacy checks passed: no INTERNET permission, backup disabled.")
          PY
      - name: Verify signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$RELEASE_APK"
          APKSIGNER="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools" -maxdepth 2 -type f -name apksigner -print -quit)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
      - name: Verify signed release Android App Bundle
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$RELEASE_AAB"
          jarsigner -verify -verbose -certs "$RELEASE_AAB"
      - name: Publish validation APKs and AAB
        if: matrix.api-level == 35
        uses: actions/upload-artifact@v6
        with:
          name: copiloto-motorista-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Room instrumentation tests (API ${{ matrix.api-level }})
    needs: build-and-test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api-level: [26, 35]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify repository wrapper
        run: test -f ./gradlew && chmod +x ./gradlew
      - name: Run database persistence tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: adb shell getprop ro.build.version.sdk && adb shell getprop sys.boot_completed && ./gradlew --no-daemon connectedDebugAndroidTest
